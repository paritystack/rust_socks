[package]
name = "rust_socks"
version = "0.1.0"
edition = "2021"
authors = ["Rust SOCKS Library"]
description = "A comprehensive SOCKS5 server and client library in Rust"
license = "MIT"
repository = "https://github.com/paritystack/rust_socks"
keywords = ["socks5", "proxy", "network", "async"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
bytes = "1.5"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "rust_socks"
path = "src/lib.rs"

[[example]]
name = "server"
path = "examples/server.rs"

[[example]]
name = "client"
path = "examples/client.rs"

[[example]]
name = "proxy_chain"
path = "examples/proxy_chain.rs"
